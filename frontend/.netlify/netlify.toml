plugins = []
redirects = []

[functions]

[functions."*"]

[build]
publish = "/Users/teomariscal/Downloads/dogs-mind-backend/frontend/frontend"
publishOrigin = "config"
base = "/Users/teomariscal/Downloads/dogs-mind-backend/frontend"

[build.environment]

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "SAMEORIGIN"

[[headers]]
for = "/"

[headers.values]
Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/index.html"

[headers.values]
Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/teo-mariscal-v3.html"

[headers.values]
Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/privacy.html"

[headers.values]
Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/terms.html"

[headers.values]
Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/service-worker.js"

[headers.values]
Cache-Control = "max-age=0, must-revalidate"

[[headers]]
for = "/manifest.json"

[headers.values]
Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
for = "/*.webp"

[headers.values]
Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
for = "/*.png"

[headers.values]
Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
for = "/*.jpg"

[headers.values]
Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
for = "/*.jpeg"

[headers.values]
Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
for = "/*.gif"

[headers.values]
Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
for = "/*.svg"

[headers.values]
Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
for = "/*.mp4"

[headers.values]
Cache-Control = "public, max-age=2592000"

[[headers]]
for = "/favicon.ico"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/icons/*"

[headers.values]
Cache-Control = "public, max-age=2592000, must-revalidate"