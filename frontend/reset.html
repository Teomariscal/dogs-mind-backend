<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elige tu contraseña · The Dogs' Mind</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ color-scheme: dark; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Jost',system-ui,sans-serif; color:#e8efea; min-height:100dvh;
    background:
      radial-gradient(ellipse 700px 450px at 50% -10%, rgba(94,200,230,.10), transparent 60%),
      linear-gradient(180deg,#0a1a14 0%,#0e1f1a 55%,#14302a 100%);
    display:flex; align-items:center; justify-content:center; padding:28px 20px;
  }
  .card{
    width:100%; max-width:420px; padding:32px 26px 28px; border-radius:22px;
    background:rgba(255,255,255,.05); border:1.5px solid rgba(94,200,230,.28);
    box-shadow:0 18px 48px rgba(0,0,0,.45); backdrop-filter:blur(10px);
  }
  .brand{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:#fff;line-height:1.1}
  .by{font-size:12.5px;color:rgba(232,239,234,.55);font-style:italic;margin:2px 0 22px}
  h1{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:#fff;margin-bottom:6px}
  p.sub{font-size:14px;line-height:1.6;color:rgba(232,239,234,.68);margin-bottom:22px}
  label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5ec8e6;font-weight:600;margin-bottom:6px}
  .field{position:relative;margin-bottom:16px}
  input{
    width:100%;padding:14px 46px 14px 15px;border-radius:12px;font-family:inherit;font-size:16px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#fff;outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input::placeholder{color:rgba(255,255,255,.38)}
  input:focus{border-color:rgba(94,200,230,.65);background:rgba(255,255,255,.10);box-shadow:0 0 0 3px rgba(94,200,230,.18)}
  .eye{position:absolute;top:50%;right:8px;transform:translateY(-50%);background:none;border:none;cursor:pointer;
    padding:9px;color:rgba(232,239,234,.62);line-height:0}
  button.go{
    width:100%;padding:16px;border:none;border-radius:100px;font-family:inherit;font-size:16px;font-weight:700;
    color:#fff;cursor:pointer;background:linear-gradient(135deg,#7eb86a,#4a6741);
    box-shadow:0 6px 20px rgba(74,103,65,.45);margin-top:6px;
  }
  button.go:disabled{opacity:.55;cursor:default}
  .msg{margin-top:16px;font-size:13.5px;line-height:1.55;padding:12px 14px;border-radius:12px;display:none}
  .msg.err{display:block;background:rgba(212,167,106,.10);border:1px solid rgba(212,167,106,.38);color:#e0bd8c}
  .msg.ok{display:block;background:rgba(126,184,106,.12);border:1px solid rgba(126,184,106,.42);color:#a9d69a}
  .hint{font-size:12px;color:rgba(232,239,234,.45);margin-top:14px;line-height:1.5}
  a{color:#80d6ee}
</style>
</head>
<body>
<div class="card">
  <div class="brand">The Dogs' Mind</div>
  <div class="by">by Teo Mariscal</div>

  <div id="form-wrap">
    <h1>Elige tu contraseña</h1>
    <p class="sub">Escribe la que quieras usar a partir de ahora. Con al menos 6 caracteres.</p>

    <div class="field">
      <label for="pw1">Nueva contraseña</label>
      <input id="pw1" type="password" autocomplete="new-password" placeholder="Tu contraseña">
      <button class="eye" type="button" data-for="pw1" aria-label="Mostrar contraseña">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div class="field">
      <label for="pw2">Repítela</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Otra vez, para confirmar">
      <button class="eye" type="button" data-for="pw2" aria-label="Mostrar contraseña">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <button class="go" id="go">Guardar y entrar</button>
    <div class="msg" id="msg"></div>
    <div class="hint">Tu contraseña anterior sigue funcionando hasta que guardes esta.</div>
  </div>
</div>

<script>
(function(){
  var API = 'https://dogs-mind-backend-production.up.railway.app';
  var params = new URLSearchParams(location.search);
  var token = params.get('t') || '';
  var msg = document.getElementById('msg');
  var go  = document.getElementById('go');

  function decir(texto, ok){
    msg.textContent = texto;
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  document.querySelectorAll('.eye').forEach(function(b){
    b.onclick = function(){
      var i = document.getElementById(b.getAttribute('data-for'));
      i.type = i.type === 'password' ? 'text' : 'password';
    };
  });

  if (!token) {
    document.getElementById('form-wrap').innerHTML =
      '<h1>Enlace incompleto</h1><p class="sub">Abre el enlace tal cual viene en el correo. ' +
      'Si lo has copiado a mano, puede haberse quedado algún carácter fuera.</p>';
  }

  go.onclick = async function(){
    var p1 = document.getElementById('pw1').value;
    var p2 = document.getElementById('pw2').value;
    if (p1.length < 6) { decir('La contraseña debe tener al menos 6 caracteres.'); return; }
    if (p1 !== p2)     { decir('Las dos contraseñas no coinciden.'); return; }
    go.disabled = true; go.textContent = 'Guardando…';
    try {
      var r = await fetch(API + '/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, new_password: p1 })
      });
      var d = {};
      try { d = await r.json(); } catch(e) {}
      if (!r.ok) {
        decir(d.detail || 'No se ha podido guardar. Pide un enlace nuevo desde la app.');
        go.disabled = false; go.textContent = 'Guardar y entrar';
        return;
      }
      /* Sesión iniciada: si abre la web, ya entra directo. */
      try { if (d.token) { localStorage.setItem('dm_jwt', d.token); localStorage.setItem('dm_email', d.email || ''); } } catch(e) {}
      document.getElementById('form-wrap').innerHTML =
        '<h1>Contraseña cambiada</h1>' +
        '<p class="sub">Ya puedes entrar en The Dogs\' Mind con tu nueva contraseña, ' +
        'tanto en la app del móvil como aquí.</p>' +
        '<button class="go" onclick="location.href=\'/\'">Ir a The Dogs\' Mind</button>' +
        '<div class="hint" style="margin-top:16px">En la app: cierra sesión si sigue abierta y entra con ' +
        (d.email ? '<strong>' + d.email + '</strong>' : 'tu email') + ' y la contraseña que acabas de elegir.</div>';
    } catch(e) {
      decir('No hay conexión con el servidor. Inténtalo en un minuto.');
      go.disabled = false; go.textContent = 'Guardar y entrar';
    }
  };
})();
</script>
</body>
</html>
